# Signs a reviewed build and publishes it to the `published` branch (catalogue §9).
#
# Run by hand from main, naming the commit of the reviewed build (for now the
# `manual-build` branch). The build output is checked without secrets; only the
# `sign` job, in the protected `catalog-signing` environment, sees the key.
# Publishing is two commits on `published`: the parts first, then the index and
# its signature, naming the parts' commit.

name: publish

on:
  workflow_dispatch:
    inputs:
      build:
        description: "Full commit SHA of the reviewed build (its output is in out/)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but a full commit SHA
        env:
          BUILD: ${{ inputs.build }}
        run: '[[ "$BUILD" =~ ^[0-9a-f]{40}$ ]] || { echo "build must be a full commit SHA"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.build }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Validate the build output
        run: bun build.ts validate out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts
          path: out/
          if-no-files-found: error

  sign:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: catalog-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: tools
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
        working-directory: tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parts
          path: parts
      - name: Check out or start the published branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q published && cd published
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.name "agents-catalog publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q --depth 1 origin published; then git checkout -q -B published FETCH_HEAD; else git checkout -q --orphan published; fi
      - name: Commit the parts
        env:
          BUILD: ${{ inputs.build }}
        run: |
          cd published
          if [ -f index.json ]; then cp index.json ../previous-index.json; fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R ../parts/. .
          rm -f index.json index.json.sig
          git add -A
          git commit -q --allow-empty -m "Parts from build ${BUILD}"
          echo "PARTS_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Write the index naming the parts' commit
        run: |
          previous=(); if [ -f previous-index.json ]; then previous=(--previous previous-index.json); fi
          bun tools/build.ts index --commit "$PARTS_COMMIT" --dir published "${previous[@]}"
      - name: Sign
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
          CATALOG_SIGNING_KEY_ID: ${{ vars.CATALOG_SIGNING_KEY_ID }}
          CATALOG_PUBLIC_KEY: ${{ vars.CATALOG_PUBLIC_KEY }}
        run: bun tools/sign/cli.ts sign published
      - name: Verify and publish
        env:
          BUILD: ${{ inputs.build }}
        run: |
          bun tools/sign/cli.ts verify published "${{ vars.CATALOG_PUBLIC_KEY }}"
          cd published
          git add index.json index.json.sig
          git commit -q -m "Index for ${PARTS_COMMIT}, build ${BUILD}"
          git push -q origin HEAD:published
